services:
  halugate:
    build:
      context: .
      dockerfile: Dockerfile
    image: halugate:latest
    container_name: halugate
    volumes:
      - .:/workspace:cached
      - ./data:/workspace/data:rw
      - ./results:/workspace/results
      - ./models:/workspace/models
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    tty: true
    stdin_open: true
    command: sleep infinity

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    image: halugate:latest
    container_name: halugate-jupyter
    ports:
      - "8888:8888"
    volumes:
      - .:/workspace:cached
      - ./data:/workspace/data:rw
      - ./results:/workspace/results
      - ./notebooks:/workspace/notebooks
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    tty: true
    stdin_open: true
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''
