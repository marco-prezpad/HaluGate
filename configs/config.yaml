# config.yaml
#
# Declarative run configuration for HaluGate. Adding a dataset or strategy
# here (plus, for a genuinely new strategy, one file under src/strategies/
# and one factory entry) is the only change needed to extend an evaluation
# run -- no code edits to evaluate.py itself.
#
# Author: Marco Pérez Padilla
# Date:   05-10-2026

data_root: data
results_root: results
random_seed: 42

# How many samples to process per detector before writing a checkpoint.
# Lower values cost a little I/O overhead but bound how much work is lost
# if a run is interrupted mid-dataset.
checkpoint_every: 500

# Number of samples used to estimate per-sample latency (kept separate from
# the full accuracy run, since timing all samples individually would be
# wasteful once the mean/percentiles have converged).
latency_sample_size: 200

bootstrap_resamples: 1000
reference_strategies:
  - length

# Grouped by shared context (see src/splitting.py), so a record's grounded
# and hallucinated answers always land in the same split.
splits:
  train: 0.7
  validation: 0.15
  test: 0.15

# Primary dataset: HaluEval (synthetic hallucinations).
# Secondary dataset: a RAGTruth-QA subset (organic hallucinations), used to
# check whether the latency-accuracy frontier observed on HaluEval holds up
# on naturally-occurring, harder-to-separate errors.
datasets:
  - halueval
  - ragtruth_qa

strategies:
  - lexical
  - distilbert
  - nli
  - length

strategies_by_dataset:
  ragtruth_qa:
    - lexical
    - distilbert_transfer
    - distilbert_indomain
    - nli_chunked
    - length

strategy_params: 
  lexical:
    n_gram_size: 1
    overlap_threshold: 0.15
  distilbert:
    model_path: models/distilbert-halu
    batch_size: 16
    max_sequence_length: 512
  distilbert_transfer:
    model_path: models/distilbert-halu
    batch_size: 32
    max_sequence_length: 512
  distilbert_indomain:
    model_path: models/distilbert-ragtruth
    batch_size: 32
    max_sequence_length: 512
  nli:
      model_name: cross-encoder/nli-deberta-v3-base
      revision: 6c749ce3425cd33b46d187e45b92bbf96ee12ec7
      batch_size: 8
      max_sequence_length: 512
  nli_chunked:
      model_name: cross-encoder/nli-deberta-v3-base
      revision: 6c749ce3425cd33b46d187e45b92bbf96ee12ec7
      batch_size: 8
      max_window_tokens: 350
      max_sequence_length: 512